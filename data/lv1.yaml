meta:
  level: 1
  title: "Lv1 · 주문 한 건의 생애주기"
  goal: "주문 상태 전이도를 직접 그릴 수 있다"
  graduation:
    - "접수 → 부분체결 → 미체결 잔량 → 정정/취소 → 전량체결/실효 흐름을 그릴 수 있다"
    - "지정가는 가격 보장·체결 미보장, 시장가는 체결 보장·가격 미보장을 예로 설명할 수 있다"
    - "같은 가격에 거래가 있었는데 내 주문이 미체결인 이유를 우선순위로 설명할 수 있다"
    - "주문수량 = 체결 + 미체결 등식과 주문가능금액 예약·복원을 연결해 설명할 수 있다"

cards:
  - id: L1-001
    level: 1
    prereq: [L0-002]
    title: "호가창은 대기 줄이 두 개인 표다"
    one_liner: "사겠다는 대기 주문과 팔겠다는 대기 주문을 가격별로 쌓아 보여주는 표."
    analogy: "중고거래 게시판 벽에 살래요 쪽지와 팔래요 쪽지가 가격순으로 붙어 있는 모습. 사는 쪽은 싸게, 파는 쪽은 비싸게 부르니 사이에 빈틈이 생긴다."
    key_insight: "매수 최고가와 매도 최저가가 만나지 않으면 아무것도 체결되지 않는다. 호가창 숫자는 아직 체결되지 않은 대기 물량이다."
    where_in_app: "주문 화면 중앙 호가창 · 매도 잔량(위) / 가격 / 매수 잔량(아래)"
    common_confusion: "현재가는 마지막으로 체결된 가격이라 호가창의 대기 가격과 다르다."
    if_wrong:
      customer_loss: true
      detail: "잔량이 실제와 다르면 체결 가능성을 잘못 판단한다. 시세 지연 시 이미 사라진 물량에 주문을 내고, 시장가 판단 근거가 되므로 불리한 가격 체결로 이어진다."
    qa_checks:
      - "시세 갱신 주기와 화면 반영 지연"
      - "네트워크 복구 후 호가창 재동기화"
      - "종목 전환 시 이전 종목 데이터 잔존"
      - "장 시작 직전 호가창 초기화"
    quiz:
      q: "종목 A에서 B로 전환했는데 호가창이 잠깐 A의 값으로 남아 있다. 표시 지연이니 넘어가도 되는가?"
      a: "안 된다. 고객은 그 숫자를 B의 호가로 인식하고 주문한다. 실시간 데이터 화면은 종목 전환 시 이전 데이터 폐기가 요건이며 빈 값이나 로딩 표시가 안전하다. 화면 단위가 아니라 데이터가 어느 종목 것인지 단위로 검증해야 한다."
    next_level_hook: "호가 잔량이 보이지 않는 시간대(동시호가)는 Lv2, 복수시장 호가 통합은 Lv3"
    simplified_away: ["동시호가", "10단계 밖 호가", "지연시세와 시세 권한", "NXT 통합호가"]

  - id: L1-002
    level: 1
    prereq: [L1-001]
    title: "지정가 — 가격을 내가 못 박는다"
    one_liner: "가격과 수량을 내가 정해 걸어두고, 그 가격에 상대가 나타나야 체결되는 주문."
    analogy: "1000원이면 살게요 쪽지를 벽에 붙여두는 것. 아무도 그 가격에 팔지 않으면 하루 종일 그대로 있다."
    key_insight: "지정가는 가격을 보장하고 체결을 보장하지 않는다. 시장가는 그 반대다. 이 트레이드오프가 주문 유형의 핵심이다."
    where_in_app: "주문 화면 지정가 탭 · 가격 입력창의 상하 버튼"
    common_confusion: "아무 가격이나 입력되지 않는다. 가격대별 호가단위의 배수만 허용되고 상한가·하한가 밖은 거부된다. 호가단위 표는 규정 개정이 있어 최신 자료 확인 필요."
    if_wrong:
      customer_loss: true
      detail: "호가단위 검증이 느슨하면 거래소에서 거부되는데 앱은 접수로 표시해 고객이 체결을 기다린다. 반대로 정상 가격을 막으면 매매 기회를 잃는다."
    qa_checks:
      - "호가단위 경계값(가격대 전환 지점 위아래)"
      - "상한가·하한가 경계"
      - "0원·음수·소수점 입력"
      - "가격 수정으로 가격대가 바뀔 때 단위 재계산"
      - "거래소 거부 응답이 화면 상태에 반영되는지"
    quiz:
      q: "주문이 접수됨으로 표시된 뒤 거래소에서 가격 오류로 거부됐다. 앱에는 계속 접수 상태로 남아 있다. 결함인가?"
      a: "결함이다. 입력 단계에서 막을 수 있는 값을 통과시킨 것도 문제지만 더 심각한 것은 뒷단 거부가 화면에 반영되지 않은 점이다. 고객은 존재하지 않는 주문의 체결을 기다린다. 검증은 가장 앞단에서 하고 뒷단 거부는 반드시 화면에 전달돼야 한다."
    next_level_hook: "조건부지정가·최유리·최우선 등 다른 유형은 Lv2"
    simplified_away: ["조건부지정가", "최유리·최우선지정가", "IOC·FOK", "호가단위 상세표"]

  - id: L1-003
    level: 1
    prereq: [L1-002]
    title: "시장가 — 수량만 정하고 가격은 맡긴다"
    one_liner: "가격을 지정하지 않고 나와 있는 반대편 호가를 순서대로 잡아 즉시 체결시키는 주문."
    analogy: "자판기에 돈을 넣고 싼 것부터 3개라고 하는 것. 제일 싼 게 1개뿐이면 나머지는 그다음 비싼 것으로 채워진다."
    key_insight: "수량이 많고 호가가 얕으면 여러 가격에 걸쳐 나눠 체결되고 평균 단가가 나빠진다(슬리피지). 현재가 곱하기 수량은 실제 체결금액이 아니다."
    where_in_app: "시장가 선택 시 가격 입력창이 비활성화되는 것, 화면의 예상 체결금액"
    common_confusion: "예상금액은 추정치다. 상대 호가를 모두 소진했을 때 남은 수량의 처리 규칙은 거래소 규정에 따르므로 확인이 필요하다."
    if_wrong:
      customer_loss: true
      detail: "예상 체결금액을 낙관적으로 계산하면 주문가능금액 검증을 통과한 뒤 실제로 자금이 부족해진다. 매수에서 특히 위험하다."
    qa_checks:
      - "호가 물량보다 큰 수량 주문"
      - "호가가 한쪽만 존재하는 상황"
      - "예상금액과 실제 체결금액 차이"
      - "여유 없이 전량 매수 시도"
      - "상한가 근처 시장가 매수"
    quiz:
      q: "증거금·미수를 쓰지 않는 현금 계좌에서 주문가능금액에 딱 맞춰 시장가 매수를 냈는데 체결 후 잔액이 마이너스가 됐다. 정상인가?"
      a: "정상이 아니다. 시장가는 체결가가 확정되지 않으므로 금액 검증을 불리한 가격 가정으로 보수적으로 잡아야 한다. 낙관적 추정으로 통과시키면 결제 부족이 발생하고 고객 미수로 직결된다."
    next_level_hook: "증거금 계좌에서 마이너스가 정상인 경우는 Lv3"
    simplified_away: ["시장가 잔량 처리 규정", "시간외 시장가 가능 여부", "슬리피지 방지 주문 유형"]

  - id: L1-004
    level: 1
    prereq: [L1-001]
    title: "체결 순서는 가격, 그다음 시간"
    one_liner: "더 유리한 가격을 낸 주문이 먼저, 같은 가격이면 먼저 낸 주문이 먼저 체결된다."
    analogy: "놀이공원 줄인데 비싼 티켓을 산 사람이 앞으로 가고 같은 티켓끼리는 먼저 온 순서. 앞사람이 다 타야 내 차례가 온다."
    key_insight: "내가 걸어둔 가격에 거래가 일어났는데도 내 주문이 체결되지 않을 수 있다. 같은 가격 대기 줄에 앞 물량이 남아 있으면 그렇다. 호가창 잔량이 내 앞에 선 물량이다."
    where_in_app: "호가창의 가격별 잔량, 주문내역의 접수 시각"
    common_confusion: "현재가가 내 주문가격을 찍었는데 왜 안 됐냐는 문의는 대부분 정상이다. 다만 정상 여부를 판단하려면 우선순위 규칙을 알아야 한다."
    if_wrong:
      customer_loss: true
      detail: "주문 전송 순서가 뒤바뀌면 고객은 서야 할 자리보다 뒤로 밀린다. 체결 기회를 잃지만 눈에 보이지 않는 손실이라 발견이 늦다."
    qa_checks:
      - "다수 주문 동시 전송 시 접수 순서 유지"
      - "재시도·네트워크 지연 상황에서 순서 역전"
      - "주문 접수 시각 기록 여부"
      - "정정 시 우선순위 변화"
    quiz:
      q: "70,000원 지정가 100주 매수 주문을 냈다. 이후 시장 체결내역에는 70,000원에 5,000주가 거래됐는데 A 고객의 100주는 한 주도 체결되지 않았다. 이것만으로 결함이라고 판단할 수 있는가?"
      a: "판단할 수 없다. 70,000원 매수 대기 줄에 A 고객보다 앞선 주문이 5,000주 이상 있었다면 정상이다. 확인할 것은 A 고객 주문의 접수 시각과 그 시점의 70,000원 매수 잔량이다. 반대로 결함 신호는 A 고객 주문이 살아 있는 동안 69,900원에 거래가 체결된 경우다. 가격 우선 원칙상 더 비싸게 부른 고객이 먼저 체결돼야 하므로, 불리한 가격에 거래가 성사됐다면 주문이 거래소 대기 줄에 없었다는 뜻이고 전송 누락이나 유실을 의심해야 한다."
    next_level_hook: "동시호가의 다른 우선순위는 Lv2, 복수시장에서 어느 줄에 서는지는 Lv3"
    simplified_away: ["수량우선·위탁자우선 원칙", "동시호가 단일가 결정", "시장간 우선순위"]

  - id: L1-005
    level: 1
    prereq: [L1-004]
    title: "미체결과 부분체결 — 주문 1건이 여러 조각이 된다"
    one_liner: "주문 수량 중 일부만 체결되고 나머지가 남는 게 정상이며, 주문 1건은 여러 체결 기록을 가질 수 있다."
    analogy: "사과 10개를 주문했는데 가게에 3개만 있어 3개만 받고 7개는 남은 상태. 영수증은 1장인데 배송은 여러 번."
    key_insight: "주문수량 = 체결수량 + 미체결잔량. 이 등식은 항상 맞아야 한다. 체결가가 여러 개면 표시 단가는 가중평균이고 반올림 규칙이 필요하다."
    where_in_app: "주문내역의 주문수량/체결수량/미체결수량, 체결내역의 여러 줄"
    common_confusion: "체결 단가가 하나가 아니다. 3주는 1000원, 7주는 1010원처럼 나뉜다."
    if_wrong:
      customer_loss: true
      detail: "등식이 깨지면 고객은 보유하지 않은 수량을 팔려 하거나 팔 수 있는 수량을 못 판다. 평균단가가 틀리면 손익이 왜곡돼 매도 판단이 흔들린다."
    qa_checks:
      - "부분체결 반복 후 합계 일치"
      - "가중평균 단가 반올림"
      - "체결 알림 건수와 방식"
      - "체결 통보가 순서를 바꿔 도착해도 합계 유지"
      - "장 종료 시 미체결 잔량 처리"
    quiz:
      q: "10주 주문 중 3주가 체결됐는데 주문내역에 체결 3주 / 미체결 8주로 표시된다. 심각도를 어떻게 판단하는가?"
      a: "최고 등급으로 본다. 합계 11주로 주문 수량을 초과했으니 등식이 깨진 신호다. 표시만의 문제라도 고객은 8주가 더 체결될 것으로 기대하고, 원장이 실제로 틀렸다면 미보유 수량 매도까지 이어진다. 숫자 불일치는 표시 결함으로 축소하지 말고 원장까지 확인해야 한다."
    next_level_hook: "장 종료 시 잔량 실효와 시간외 이관은 Lv2"
    simplified_away: ["잔량 자동취소 규칙", "IOC·FOK", "착오매매 정정·취소"]

  - id: L1-006
    level: 1
    prereq: [L1-005]
    title: "정정 — 미체결 잔량만 바꿀 수 있다"
    one_liner: "아직 체결되지 않은 수량에 대해서만 가격이나 수량을 바꿀 수 있고 체결된 부분은 되돌릴 수 없다."
    analogy: "벽에 붙인 쪽지 내용을 고치는 것. 이미 거래가 끝나 떼어진 쪽지는 고칠 게 없다."
    key_insight: "정정 가능 수량의 상한은 미체결 잔량이다. 3주 체결된 10주 주문은 7주까지만 정정 대상이다. 가격을 바꾸면 시간 우선순위를 잃고 대기 줄 맨 뒤로 간다."
    where_in_app: "미체결 목록에서 주문 선택 시 나오는 정정·취소 버튼"
    common_confusion: "정정 버튼을 누른 순간과 서버 도달 순간 사이에 잔량이 줄어들 수 있다. 화면의 잔량은 이미 과거다. 수량 감액과 가격 변경의 우선순위 처리는 규정 확인 필요."
    if_wrong:
      customer_loss: true
      detail: "화면 잔량 기준으로 정정을 허용하면 그사이 체결된 수량만큼 초과 정정이 발생한다. 고객이 의도한 것보다 많은 수량이 시장에 남거나 사라진다."
    qa_checks:
      - "체결과 정정이 동시에 일어나는 경쟁 상태"
      - "잔량을 초과하는 수량으로 정정 시도"
      - "전량 체결된 주문에 정정 시도"
      - "정정 후 주문번호 유지 여부"
      - "정정 실패 시 원 주문 생존 여부"
    quiz:
      q: "미체결 7주 주문을 10주로 정정 요청했는데 성공 응답이 왔다. 정상인가?"
      a: "정상이 아니다. 잔량을 초과하는 정정이 통과했으니 검증 누락이다. 함께 확인할 것은 실제로 시장에 나간 수량과 주문가능금액 차감액이다. 화면만 성공이고 거래소는 거부했을 수도, 둘 다 통과해 3주만큼 담보 없는 주문이 나갔을 수도 있다. 후자면 미수로 직결된다."
    next_level_hook: "장 마감 직전 정정 제한과 시간외 정정은 Lv2"
    simplified_away: ["정정 우선순위 상세 규칙", "시장간 정정", "자동 정정 기능"]

  - id: L1-007
    level: 1
    prereq: [L1-006]
    title: "취소 — 되돌리는 게 아니라 남은 것을 거두는 것"
    one_liner: "취소는 미체결 잔량을 시장에서 빼는 행위이고 체결된 거래를 무르는 기능이 아니다."
    analogy: "붙여둔 쪽지를 떼는 것. 이미 손바뀜이 끝난 거래는 쪽지를 떼도 되돌아오지 않는다."
    key_insight: "취소 성공은 주문 소멸이 아니라 잔량 소멸이다. 부분체결 주문을 취소하면 체결분은 그대로 남는다. 취소 요청 도달 전에 체결이 끝나면 취소 실패가 정상이다."
    where_in_app: "미체결 목록의 취소 버튼, 주문내역에 남는 취소 상태 기록"
    common_confusion: "취소해도 주문 기록은 남아야 한다. 목록에서 완전히 사라지면 고객은 무슨 일이 있었는지 확인할 수 없다."
    if_wrong:
      customer_loss: true
      detail: "취소 실패를 성공으로 표시하면 고객은 주문이 없어졌다고 믿고 같은 주문을 다시 내 2배 수량을 보유한다. 반대로 성공을 실패로 표시하면 불필요한 재시도가 이어진다."
    qa_checks:
      - "체결 직전 취소 요청(경쟁 상태)"
      - "취소 요청 중복 전송"
      - "취소 후 주문가능금액 복원 시점"
      - "취소된 주문의 이력 보존"
      - "취소 실패 사유가 구분되어 표시되는지"
    quiz:
      q: "취소 요청 후 앱에 취소 완료가 떴는데 잠시 뒤 체결 알림이 왔다. 어느 쪽을 신뢰해야 하는가?"
      a: "체결 쪽, 즉 원장 기록이다. 취소와 체결이 경합하면 거래소 처리 순서가 결과를 정한다. 여기서 결함은 체결이 아니라 취소 완료 표시다. 요청을 보냈다는 사실과 처리가 확정됐다는 사실을 구분해 표시하지 않으면 고객은 미확정 상태를 확정으로 오해한다."
    next_level_hook: "장 마감 직전 취소 가능 시간은 Lv2, SOR 재전송 중 취소는 Lv3"
    simplified_away: ["착오매매 취소", "일괄취소", "장 종료 시 자동 실효"]

  - id: L1-008
    level: 1
    prereq: [L0-001, L1-005]
    title: "주문가능금액은 주문 순간에 예약된다"
    one_liner: "주문을 내면 그 금액이 미리 잡혀 주문가능금액에서 빠지고 체결·취소에 따라 다시 조정된다."
    analogy: "놀이기구를 예약하면 티켓이 미리 차감되고 안 타면 돌려받는다. 예약 중인 티켓으로 다른 것을 또 예약할 수는 없다."
    key_insight: "주문가능금액은 잔액이 아니라 지금 새 주문을 낼 수 있는 한도다. 미체결 주문이 잡아둔 금액과 수수료까지 감안하므로 예수금 전액 매수가 거부되는 것은 정상이다."
    where_in_app: "주문 화면의 주문가능금액, 최대 버튼으로 채워지는 수량"
    common_confusion: "수수료·세금은 증권사와 시점에 따라 다르고 세율도 개정된다. QA는 특정 숫자를 외우는 게 아니라 계산에 들어갈 항목이 빠지지 않았는지를 본다."
    if_wrong:
      customer_loss: true
      detail: "예약 차감이 없으면 같은 돈으로 여러 주문이 통과해 총액이 예수금을 넘고 미수가 된다. 취소·미체결 후 복원이 없으면 고객이 자기 돈을 쓰지 못한다."
    qa_checks:
      - "여러 주문을 빠르게 연속 전송할 때 합계가 한도를 넘는지"
      - "취소·미체결 후 한도 복원 시점"
      - "최대 버튼 수량으로 실제 주문이 통과하는지"
      - "수수료 포함 여부"
      - "앱과 웹 동시 접속 시 한도 이중 사용"
    quiz:
      q: "주문가능금액 100만원 계좌에서 90만원 주문 2건을 거의 동시에 냈더니 둘 다 접수됐다. 결함인가?"
      a: "결함이다. 첫 주문이 90만원을 예약했으므로 두 번째는 거부돼야 한다. 둘 다 통과했다면 한도 검증이 주문 간에 공유되지 않은 동시성 문제다. 순차 테스트는 통과하고 동시 테스트에서만 깨지는 유형이라 단건 기능 테스트로는 발견되지 않는다. 금액 검증에는 동시 요청 시나리오가 반드시 포함돼야 한다."
    next_level_hook: "한도가 예수금보다 큰 이유는 Lv3, D+2 자금이 한도에 반영되는 시점은 Lv2"
    simplified_away: ["증거금률", "대용금", "신용융자", "통합증거금", "외화 주문"]

interview_questions:
  - "부분체결된 주문의 정정을 어떻게 테스트하십니까. 체결과 정정이 동시에 발생하는 상황은 어떻게 재현하십니까"
  - "주문가능금액 검증에서 동시 요청 시나리오를 어떻게 설계하십니까"
  - "취소 요청과 체결이 경합할 때 화면 표시 요건을 어떻게 정의하십니까"
  - "시장가 주문의 예상금액과 실제 체결금액 차이를 어떤 기준으로 결함이라고 판단하십니까"
  - "주문 접수 순서가 보장되는지 검증한 경험이 있으십니까"
