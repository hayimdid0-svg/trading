meta:
  level: 0
  title: "Lv0 · 돈과 주식이 어디로 움직이나"
  goal: "용어 암기 없이 거래의 3단 구조를 이해한다"
  graduation:
    - "주식 살 돈은 증권계좌의 예수금이다"
    - "증권사는 전달, 거래소는 매칭. 정보가 두 곳에 나뉜다"
    - "주문·체결·결제는 다른 사건이고 숫자가 안 맞는 기간이 정상이다"

cards:
  - id: L0-001
    level: 0
    prereq: []
    title: "주식 살 돈은 어디에 있나"
    one_liner: "은행 돈으로 바로 못 산다. 증권계좌로 옮긴 돈(예수금)으로만 산다."
    analogy: "지갑에 현금이 있어도 버스는 못 탄다. 교통카드에 충전해야 탄다. 증권계좌가 교통카드, 예수금이 충전 잔액."
    where_in_app: "MTS 홈 상단 · 예수금 / 주문가능금액 / 총평가금액"
    common_confusion: "예수금과 주문가능금액은 다른 숫자다. 다른 게 정상."
    if_wrong:
      customer_loss: true
      detail: "과대 계산 시 미수 발생 후 반대매매로 강제 손실 확정. 과소 계산 시 매수 기회 손실."
    qa_checks:
      - "입금 후 예수금 반영 시점"
      - "홈/주문/잔고 화면 숫자 일치"
      - "앱 재진입 후 값 유지"
      - "출금가능금액 초과 신청 차단"
    quiz:
      q: "예수금 0원, 보유 종목 없음, 신용·미수 약정 없음인 계좌에서 현금 매수 주문 10만원이 정상 접수됐다. 버그인가?"
      a: "버그다. 담보가 될 대용금도 없고 약정도 없으므로 주문가능금액은 0원이어야 한다. 단 전제조건 중 하나라도 빠지면 판단이 달라진다. 대용금이나 신용 보증금이 있으면 예수금 0원에도 매수가 정상이다. 그래서 금액 검증 결함은 계좌 상태를 재현 조건에 명시해야 한다. 결함 방향도 중요하다. 못 사게 막는 쪽은 기회 손실로 끝나지만 없는 돈으로 주문이 나가는 쪽은 미수와 반대매매까지 이어진다."
    next_level_hook: "주문가능금액 > 예수금인 이유는 Lv3(증거금)"
    simplified_away: ["증거금", "대용금", "신용융자", "외화예수금"]

  - id: L0-002
    level: 0
    prereq: [L0-001]
    title: "증권사와 거래소는 하는 일이 다르다"
    one_liner: "증권사는 주문을 전달하는 창구, 거래소는 매수·매도를 짝지어주는 장터."
    analogy: "벼룩시장 게시판이 거래소, 게시판에 쪽지를 붙여주는 접수 창구가 증권사. 가격은 창구가 정하지 않는다."
    key_insight: "증권사는 내 돈과 주식 목록(원장), 거래소는 가격과 체결을 관리한다. 정보가 두 시스템에 나뉜다."
    where_in_app: "주문 접수 알림과 체결 알림이 따로 오는 이유"
    common_confusion: "'주문 완료'는 산 게 아니다. 쪽지를 붙였을 뿐 짝이 안 맞으면 장 종료와 함께 사라진다."
    if_wrong:
      customer_loss: true
      detail: "전송 실패를 접수로 표시하면 기회 손실. 전송 성공을 미접수로 표시하면 중복 주문으로 2배 매수."
    qa_checks:
      - "주문 전송 중 통신 단절 시 화면 상태"
      - "오류 후 재시도에서 주문 2건 발생 여부"
      - "접수/체결 알림 순서"
      - "앱 주문내역과 거래소 접수내역 대조"
    quiz:
      q: "매수 주문 후 앱에 '일시적 오류'가 떴다. 거래소에 접수되지 않았다고 판단할 수 있는가?"
      a: "판단할 수 없다. 앱이 응답을 못 받았다는 뜻일 뿐, 주문이 거래소에 도달했는지는 알 수 없다. 실제 상태는 주문내역·미체결 목록에서 확인해야 한다. QA는 두 가지를 본다. 실패 메시지와 실제 주문 상태가 일치하는지, 같은 주문이 여러 번 전송돼도 1건으로 처리되는지. 중복 방지는 고객의 주의가 아니라 시스템이 보장할 요건이다."
    next_level_hook: "멱등성과 주문 순서보장은 Lv4"
    simplified_away: ["복수시장(KRX/NXT)", "SOR", "예탁결제원", "호가 매칭 우선순위"]

  - id: L0-003
    level: 0
    prereq: [L0-002]
    title: "주문, 체결, 결제는 서로 다른 사건이다"
    one_liner: "거래는 주문 → 체결 → 결제 3단계이고 단계 사이에 시간 간격이 있다."
    analogy: "쇼핑몰 주문하기(주문) → 판매자 확인으로 거래 확정(체결) → 택배 도착과 정산(결제). 약속과 실제 교환은 다른 날."
    key_insight: "체결 후 결제까지 영업일 2일(T+2). 그래서 잔고와 출금가능금액이 정상적으로 안 맞는 기간이 있다."
    where_in_app: "잔고 화면의 예수금 / D+1 / D+2 예수금 구분"
    common_confusion: "잔고에 보이는 것과 결제가 끝난 것은 다르다."
    if_wrong:
      customer_loss: true
      detail: "미체결을 체결로 표시하면 없는 주식 매도 시도. 결제 전 자금을 출금 가능으로 표시하면 증권사 손실. 체결 누락은 대량 민원."
    qa_checks:
      - "미체결 주문 목록 표시"
      - "체결 알림과 잔고 갱신 시차"
      - "단계별 취소 가능 여부(체결 건 취소 불가)"
      - "부분체결 표시"
      - "일자 변경 시 D+1 → D+2 이동"
    quiz:
      q: "오전 매도 체결, 오후 출금 신청 시 출금가능금액 0원. 버그인가?"
      a: "정상일 가능성이 높다(T+2). 오히려 출금이 되면 버그다. '안 되는 게 정상'인 케이스가 금융 도메인에 많다."
    next_level_hook: "부분체결과 정정 가능 수량은 Lv1, 휴장일 포함 T+2 계산은 Lv2"
    simplified_away: ["부분체결", "동시호가", "휴장일 반영", "해외주식 결제주기"]

interview_questions:
  - "주문가능금액과 예수금이 다른 화면에서 불일치할 때 무엇을 먼저 확인하십니까"
  - "주문 전송 실패 후 재시도에서 중복 주문이 발생하지 않는지 어떻게 검증하십니까"
  - "체결과 결제 시점 차이 때문에 정상인데 버그로 보이는 케이스를 어떻게 구분하십니까"
