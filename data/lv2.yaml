meta:
  level: 2
  title: "Lv2 · 시간이 만드는 규칙"
  goal: "하루의 구간 지도를 그리고 구간별 주문 동작 차이를 설명할 수 있다"
  graduation:
    - "하루의 구간을 나누고 구간마다 주문이 어떻게 다르게 동작하는지 그릴 수 있다"
    - "동시호가에서 시간 우선순위가 작동하지 않는 이유를 설명할 수 있다"
    - "장 종료 시 실효와 주문가능금액 복원의 연결을 설명할 수 있다"
    - "잔고에 주식은 있는데 출금이 안 되는 이유를 설명할 수 있다"
    - "휴장일 달력 하나가 결제일·미수 판정까지 영향을 미치는 경로를 설명할 수 있다"

cards:
  - id: L2-001
    level: 2
    prereq: [L1-002]
    title: "하루는 여러 구간으로 나뉜다"
    one_liner: "시간대별로 주문 접수 규칙과 체결 방식이 다른 구간으로 하루가 나뉜다."
    analogy: "급식실은 배식 전에는 줄만 서고, 배식 중에는 순서대로 받고, 배식 후에는 남은 것만 정해진 방식으로 나눈다. 같은 공간인데 시간에 따라 규칙이 다르다."
    key_insight: "구간이 바뀌는 순간이 QA의 핵심 관심사다. 같은 주문을 같은 방식으로 냈는데 시각만 달라 결과가 달라지는 것이 정상이다."
    where_in_app: "시간대에 따라 선택 가능한 주문 유형이 바뀌는 것, 장 종료 후 주문 버튼 비활성화"
    common_confusion: "구간별 시간은 거래소 규정과 대체거래소 출범으로 변경 이력이 있어 최신 공지 확인이 필요하다."
    if_wrong:
      customer_loss: true
      detail: "구간 판단이 틀리면 허용되지 않는 주문이 통과해 거래소에서 거부되거나 정상 주문이 차단된다. 서버와 앱 시각이 어긋나면 경계 시각에서 둘이 동시에 발생한다."
    qa_checks:
      - "구간 전환 시각 전후 1분의 주문 가능 여부"
      - "앱과 서버 시각 불일치 상황"
      - "주문 화면을 열어둔 채 구간이 바뀔 때 화면 갱신"
      - "단말 시각을 임의 변경했을 때의 동작"
    quiz:
      q: "단말 시각을 15:00으로 바꾼 뒤 주문했더니 실제 시각이 18:30인데도 정규장 주문이 접수됐다. 결함인가?"
      a: "결함이다. 구간 판단은 서버 시각 기준이어야 하며 단말 시각으로 판단하면 조작이 가능하다. 접수된 주문은 거래소에서 거부되므로 고객은 접수된 줄 알고 기다린다. 클라이언트에서 오는 값은 모두 신뢰할 수 없는 입력이며 시각도 예외가 아니다."
    next_level_hook: "대체거래소의 다른 운영시간과 시장 선택은 Lv3"
    simplified_away: ["NXT 운영시간", "해외시장 시간대", "예약주문 접수 구간"]

  - id: L2-002
    level: 2
    prereq: [L2-001, L1-004]
    title: "동시호가 — 모았다가 한 가격으로 한꺼번에"
    one_liner: "주문을 접수만 해두고 체결시키지 않다가 정해진 시각에 하나의 가격으로 일괄 체결한다."
    analogy: "반 전체가 희망 가격을 쪽지에 적어 상자에 넣는다. 시간이 되면 가장 많은 거래가 성립하는 가격 하나를 정해 모두 그 가격으로 거래한다. 먼저 넣었다고 먼저 거래되지 않는다."
    key_insight: "접속매매에서는 즉시 체결되지만 동시호가에서는 시간 우선순위가 작동하지 않는다. Lv1의 가격·시간 우선 규칙이 이 구간에서 다르게 적용된다."
    where_in_app: "장 시작 전·마감 직전의 예상 체결가 표시, 체결 없이 쌓이는 호가"
    common_confusion: "예상 체결가는 주문이 들어올 때마다 계속 바뀌는 추정치이며 확정 가격이 아니다. 시간대와 호가 공개 범위는 규정 개정이 있어 확인이 필요하다."
    if_wrong:
      customer_loss: true
      detail: "예상 체결가를 확정가처럼 표시하면 고객은 그 가격에 체결될 것으로 믿고 주문한다. 시간 우선순위가 있는 것처럼 안내하면 민원 응대 기준 자체가 틀어진다."
    qa_checks:
      - "동시호가 중 체결 발생 여부"
      - "예상 체결가 갱신 주기와 확정 여부 표시"
      - "단일가 결정 시각의 일괄 체결 처리"
      - "동시호가 중 취소·정정 가능 여부"
      - "이 구간에서 허용되지 않는 주문 유형 차단"
    quiz:
      q: "장 시작 동시호가 중 낸 주문이 09:00에 체결됐고 10분 늦게 주문한 사람도 같은 가격에 체결됐다. 선착순 위반인가?"
      a: "위반이 아니다. 동시호가는 접수 시각과 무관하게 단일가로 일괄 체결한다. QA가 확인할 것은 체결 여부가 아니라 화면과 안내가 이 규칙을 설명하는지다. 접속매매와의 차이가 드러나지 않으면 정상 동작이 결함으로 신고되고 진짜 결함이 그 신고들 속에 묻힌다."
    next_level_hook: "복수시장에서 동시호가 시간이 다른 문제는 Lv3"
    simplified_away: ["단일가 결정 알고리즘", "수량우선 원칙", "임의종료", "시가 결정 특례"]

  - id: L2-003
    level: 2
    prereq: [L2-001, L1-008]
    title: "장이 끝나면 미체결 주문은 사라진다"
    one_liner: "당일 유효한 주문은 장 종료와 함께 실효되며 다음 날로 자동 이월되지 않는다."
    analogy: "벽에 붙여둔 쪽지를 청소 시간에 전부 떼어낸다. 내일도 받고 싶으면 내일 다시 붙여야 한다."
    key_insight: "미체결 잔량이 사라질 때 그 주문이 잡아두고 있던 주문가능금액이 함께 풀려야 한다. Lv1의 예약·복원이 시간 축과 만나는 지점이다."
    where_in_app: "장 종료 후 비는 미체결 목록, 다음 날 아침의 주문가능금액"
    common_confusion: "주문은 사라지지만 이력은 남아야 한다. 실효 시각은 구간별로 다를 수 있어 확인이 필요하다."
    if_wrong:
      customer_loss: true
      detail: "실효 누락 시 다음 날 유령 주문이 의도하지 않은 시점에 체결된다. 금액 복원이 안 되면 고객 자금이 묶인 채 다음 날을 맞는다."
    qa_checks:
      - "장 종료 후 미체결 목록 상태"
      - "주문가능금액 복원 시점과 금액 일치"
      - "일자 변경 배치 처리 결과"
      - "종료 직전 접수된 주문의 처리"
      - "실효된 주문의 이력 조회"
    quiz:
      q: "전일 미체결 주문 10주가 다음 날 09:00에 체결됐다. 고객은 주문한 적이 없다고 한다. 무엇을 먼저 확인하는가?"
      a: "전일 실효 처리 여부와, 그 주문이 시간외·예약주문 경로로 살아 있던 것인지를 구분해야 한다. 당일 유효 주문이 이월됐다면 실효 배치 누락이라는 심각한 결함이다. 예약주문이었다면 정상 동작이며 문제는 예약 상태가 화면에 드러나지 않은 쪽이다."
    next_level_hook: "예약주문과 기간 지정 주문은 별도 규칙이며 증권사별로 다르다"
    simplified_away: ["예약주문", "IOC·FOK", "시간외 이관 규칙"]

  - id: L2-004
    level: 2
    prereq: [L2-001]
    title: "장이 끝난 뒤에도 거래하는 구간이 있다"
    one_liner: "정규장 이후에도 정해진 시간대에 제한된 방식으로 거래할 수 있고 규칙은 정규장과 다르다."
    analogy: "문 닫은 가게가 뒷문에서 정해진 시간에 남은 물건을 파는 것. 살 수는 있지만 가격 협상은 안 되고 물건도 적다."
    key_insight: "가격 결정 방식과 변동 허용폭이 정규장과 다르다. 종가로만 거래되는 구간과 주기적으로 단일가 체결하는 구간이 나뉜다. 정규장에서 되던 주문 유형이 거부되는 것이 정상이다."
    where_in_app: "장 종료 후에도 열리는 주문 화면, 시간외 전용 주문 유형"
    common_confusion: "구간별 시간대와 가격 제한폭, 대체거래소 출범 이후의 거래시간은 최신 공지 확인이 반드시 필요하다."
    if_wrong:
      customer_loss: true
      detail: "허용되지 않는 주문 유형을 통과시키면 거래소 거부로 이어진다. 가격 제한폭 검증이 느슨하면 고객 주문이 조용히 버려진다."
    qa_checks:
      - "구간별 허용 주문 유형과 가격 제한 경계값"
      - "정규장 미체결 잔량의 시간외 자동 이관 여부"
      - "단일가 체결 주기마다의 처리"
      - "구간 종료 시 잔량 처리"
      - "시간외 체결분의 결제일 기준"
    quiz:
      q: "시간외 구간에 낸 주문 500주 중 20주만 체결되고 나머지가 미체결로 남아 있다. 결함인가?"
      a: "결함이 아닐 가능성이 높다. 시간외는 참여자가 적어 물량이 채워지지 않는 것이 일상적이며 Lv1의 부분체결과 같은 현상이다. 확인할 것은 주문수량 = 체결 + 미체결 등식 유지와 구간 종료 시 잔량 처리 규칙이다. 유동성 문제와 시스템 결함을 구분하지 못하면 리포트가 신뢰를 잃는다."
    next_level_hook: "대체거래소의 애프터마켓과 SOR 재전송은 Lv3"
    simplified_away: ["시간외 단일가 주기", "가격 제한폭 수치", "NXT 애프터마켓", "시간외 대량매매"]

  - id: L2-005
    level: 2
    prereq: [L2-002]
    title: "가격이 급변하면 잠깐 멈춘다"
    one_liner: "짧은 시간에 가격이 크게 움직이면 거래를 짧게 중단하고 단일가 방식으로 전환하는 안전장치가 작동한다."
    analogy: "수영장에서 소란이 생기면 안전요원이 호루라기를 불고 몇 분간 전원 대기시킨다. 정리되면 다시 시작한다."
    key_insight: "발동되면 해당 종목만 접속매매가 멈추고 단일가로 바뀐다. 직전까지 정상이던 주문이 거부되거나 대기 상태가 되는 것이 정상이다."
    where_in_app: "종목 화면의 발동 안내 표시, 주문 시 반환되는 거부 사유"
    common_confusion: "발동 기준과 지속 시간은 종목·상황별로 다르고 규정 개정이 있어 확인이 필요하다. 시장 전체 중단 장치와는 별개다."
    if_wrong:
      customer_loss: true
      detail: "발동 상태를 알리지 않으면 고객은 이유를 모른 채 재시도를 반복한다. 발동 종목을 정상 처리하면 거래소 거부가 쌓인다."
    qa_checks:
      - "발동 알림 표시와 해제 후 원복"
      - "발동 중 신규·정정·취소 처리"
      - "발동 직전 접수된 주문의 상태"
      - "발동 상태를 서버에서 받아 화면에 반영하는 경로"
      - "여러 종목 동시 발동"
    reproduction_note: "원하는 시점에 만들 수 없는 상태다. 상태값 주입이 가능한 테스트 환경을 요구하거나, 운영 발동 시점에 맞춰 확인 절차를 미리 준비하는 두 가지 접근이 있다."
    quiz:
      q: "특정 종목에서만 주문이 계속 거부되고 다른 종목은 정상이다. 장애로 신고해야 하는가?"
      a: "신고 전에 그 종목의 시장 상태를 확인해야 한다. 발동이나 거래정지 상태면 거부가 정상이고 결함은 거부 사유가 화면에 표시되지 않은 쪽이다. 종목 단위로 상태가 달라진다는 것을 모르면 정상 안전장치를 장애로 보고하고, 반대로 진짜 장애를 안전장치로 넘길 위험도 생긴다."
    next_level_hook: "시장 전체 중단과 비상대응 절차는 Lv4"
    simplified_away: ["동적·정적 발동 기준 수치", "서킷브레이커", "사이드카", "단기과열 완화장치"]

  - id: L2-006
    level: 2
    prereq: [L2-001]
    title: "아예 거래할 수 없는 날과 종목이 있다"
    one_liner: "시장 전체가 열리지 않는 날이 있고, 시장은 열려도 특정 종목만 거래가 막히는 경우가 있다."
    analogy: "학교 전체가 쉬는 공휴일과, 학교는 열었는데 한 반만 빠지는 것의 차이."
    key_insight: "휴장일은 주말·공휴일 외에 임시로 정해지는 날도 있어 하드코딩할 수 없고 달력 데이터로 관리해야 한다. 이 달력이 틀리면 결제일 계산이 전부 어긋난다."
    where_in_app: "휴장일 안내 공지, 거래정지 종목의 주문 차단 메시지"
    common_confusion: "거래정지는 사유와 기간이 종목마다 다르다. 정지 중에도 조회는 되어야 하지만 주문은 막혀야 한다."
    if_wrong:
      customer_loss: true
      detail: "휴장일 달력이 틀리면 결제일과 예수금 사용 시점이 밀려 고객이 쓸 수 있는 돈을 못 쓰거나 없는 돈을 쓰게 된다. 거래정지 종목 주문은 전량 거부된다."
    qa_checks:
      - "휴장일 달력 데이터 갱신 경로와 임시 휴장 반영"
      - "휴장일 주문 시도 차단"
      - "거래정지 종목의 조회 가능·주문 차단"
      - "정지 해제 후 정상화"
      - "정지 중 보유 종목의 평가금액 표시"
    quiz:
      q: "임시 휴장일이 생겼는데 앱에서 그날 주문이 접수됐다. 이 결함의 영향 범위를 어떻게 보는가?"
      a: "주문 차단 실패보다 넓게 봐야 한다. 휴장일 달력은 결제일 계산의 입력값이므로 그 기간 매매의 결제일과 예수금 사용 가능일이 모두 틀어졌을 수 있다. 증상은 주문 화면에서 났지만 영향은 정산까지 간다. 공통 기준 데이터의 결함은 그 데이터를 쓰는 모든 곳을 조사 범위로 잡아야 한다."
    next_level_hook: "해외시장의 다른 휴장일과 서머타임은 Lv3"
    simplified_away: ["거래정지 사유별 기간", "정리매매", "상장폐지 절차", "해외 휴장일"]

  - id: L2-007
    level: 2
    prereq: [L0-003]
    title: "체결과 돈의 이동은 다른 날 일어난다"
    one_liner: "체결은 거래를 확정하는 사건이고 실제 자금·주식 교환은 영업일 기준 2일 뒤 완료된다."
    analogy: "쇼핑몰에서 주문 확정과 택배 도착이 다른 날인 것과 같다."
    key_insight: "계좌에는 성격이 다른 숫자가 여러 개 있다. 지금 출금 가능한 돈, 하루 뒤 쓸 수 있는 돈, 이틀 뒤 쓸 수 있는 돈이 따로 관리된다. 매도 대금이 주문에는 쓰이지만 출금은 안 되는 것이 정상이다."
    where_in_app: "잔고 화면의 예수금 / D+1 / D+2 구분, 출금 화면의 출금가능금액"
    common_confusion: "재매수 가능 여부와 항목 명칭은 증권사 정책에 따라 다르므로 실제 앱에서 확인이 필요하다."
    if_wrong:
      customer_loss: true
      detail: "결제 전 자금을 출금 가능으로 표시하면 고객이 인출해 증권사가 손실을 본다. 반대로 쓸 수 있는 돈을 못 쓰게 하면 매수 기회를 잃는다."
    qa_checks:
      - "매도 체결 직후 출금가능금액과 주문가능금액의 차이"
      - "일자 변경 시 D+1 → D+2 자금 이동"
      - "결제일 도래 시 출금 가능 전환"
      - "매수 결제 전 잔고 표시"
      - "여러 결제일이 겹친 계좌의 합계 검증"
    quiz:
      q: "100만원 매도가 오늘 체결됐고 오늘 출금가능금액이 100만원 늘었다. 정상인가?"
      a: "정상이 아니다. 결제되지 않은 자금은 출금 대상이 아니므로 늘어야 할 것은 결제 예정 자금이다. 이 결함은 고객이 손해를 보지 않아 신고되지 않고 오래 남는다. 고객이 이득을 보는 방향의 결함은 발견이 늦으므로 금액 검증은 민원이 아니라 정기 대조로 잡아야 한다."
    next_level_hook: "미수와 반대매매의 판정 기준일은 Lv3"
    simplified_away: ["결제 불이행 처리", "증거금", "해외주식 결제주기", "배당 기준일"]

  - id: L2-008
    level: 2
    prereq: [L2-006, L2-007]
    title: "이틀은 날짜로 세지 않는다"
    one_liner: "T+2의 2일은 달력 날짜가 아니라 영업일 기준이므로 주말·휴장일이 끼면 실제로는 더 걸린다."
    analogy: "이틀 뒤가 등교일 기준이면 금요일의 이틀 뒤는 화요일이다. 공휴일까지 있으면 수요일이 된다."
    key_insight: "결제일 계산은 휴장일 달력을 입력으로 받는 함수다. 달력이 틀리면 계산이 통째로 틀린다. 명절 연휴 전후가 가장 위험하다."
    where_in_app: "매도 후 표시되는 출금가능일, 잔고 화면의 D+2 기준일"
    common_confusion: "달력 날짜로 이틀을 세면 금요일 체결이 일요일 결제가 된다. 영업일 기준이라는 점이 계산의 전제다."
    if_wrong:
      customer_loss: true
      detail: "결제일이 하루라도 틀리면 출금 시점, 이자·수수료 계산, 미수 판정 기준일이 함께 틀린다. 미수 판정일이 밀리면 반대매매 시점까지 영향을 받는다."
    qa_checks:
      - "금요일 체결의 결제일"
      - "연휴 직전 체결의 결제일"
      - "임시 휴장이 추가됐을 때 재계산"
      - "월말·연말 경계"
      - "달력 데이터 없이 계산을 시도할 때의 동작"
    automation_note: "재현 제약이 없어 자동화 가치가 가장 높다. 날짜를 입력으로 주면 언제든 검증되므로 휴장일 달력과 기대 결제일 쌍을 데이터로 만들어 수백 케이스를 회귀 테스트로 돌릴 수 있다. 제약이 없는 로직을 먼저 자동화하고 제약이 큰 것을 수동으로 남기는 것이 자동화 우선순위의 기본이다."
    quiz:
      q: "목요일 체결 건의 결제일이 다음 주 월요일로 계산됐다. 그 주 금요일이 임시 휴장일이었다면 정상인가?"
      a: "정상이다. 금요일이 영업일이 아니므로 영업일 이틀은 월요일이 된다. 중요한 것은 계산 결과가 아니라 어떤 달력을 참조했는지다. 같은 코드가 임시 휴장 반영 전 달력을 보면 금요일로 계산한다. 데이터가 결과를 바꾸는 구조이므로 테스트는 달력 버전을 고정한 상태에서 해야 재현된다."
    next_level_hook: "해외주식의 다른 결제주기와 환전 결제는 Lv3"
    simplified_away: ["결제기관 처리 일정", "해외 결제주기", "권리 기준일 계산"]

interview_questions:
  - "장 운영시간에 의존하는 테스트를 어떻게 계획하십니까. 검증 창이 짧은 항목의 우선순위를 어떻게 정하십니까"
  - "VI나 거래정지처럼 원하는 시점에 재현할 수 없는 상태는 어떻게 검증하십니까"
  - "휴장일 달력이 잘못 반영된 결함의 영향 범위를 어떻게 산정하십니까"
  - "결제일 계산 로직의 테스트 케이스를 어떻게 설계하십니까"
  - "고객이 이득을 보는 방향의 금액 결함은 어떻게 발견하십니까"
